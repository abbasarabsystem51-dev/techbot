name: TechNews Agent

on:
  workflow_dispatch:
    inputs:
      run_index:
        description: 'Run: 0=inbox-only, 1-5=content'
        required: true
        type: choice
        options: ['0', '1', '2', '3', '4', '5']
        default: '1'
      dry_run:
        description: 'Dry run (no publish, no state write)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: techbot
  cancel-in-progress: false

jobs:
  run-techbot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Prepare
        run: |
          mkdir -p data logs assets
          git config user.name "techbot"
          git config user.email "techbot@users.noreply.github.com"
          git pull --rebase origin main || true
      - name: Run
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONPATH: src:.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          EITAA_BOT_TOKEN: ${{ secrets.EITAA_API_KEY }}
          EITAA_API_KEY: ${{ secrets.EITAA_API_KEY }}
          EITAA_CHANNEL_ID: ${{ secrets.EITAA_CHANNEL_ID }}
        run: |
          PYTHONPATH=src python -u -m techbot.main \
            --run-index ${{ github.event.inputs.run_index }} \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
      - name: Commit state
        if: always() && github.event.inputs.dry_run != 'true'
        run: |
          git add data/ || true
          git status
          git diff --cached
          if git diff --cached --quiet; then
            echo "No changes in state.json."
            exit 0
          fi
          git commit -m "chore(state): run ${{ github.run_id }} idx=${{ github.event.inputs.run_index }}"
          git pull --rebase origin main
          git push
