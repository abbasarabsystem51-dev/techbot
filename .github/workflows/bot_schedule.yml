name: TechNews Bot (dispatch only)

on:
  workflow_dispatch:
    inputs:
      run_index:
        description: 'Run index (1=09:00, 2=12:00, 3=15:00, 4=18:00, 5=21:00 Tehran)'
        required: true
        type: choice
        options: ['1', '2', '3', '4', '5']
      dry_run:
        description: 'Dry run (print only, nothing is published, state is not saved)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  run-techbot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: techbot
      cancel-in-progress: false
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore state cache
        uses: actions/cache/restore@v4
        with:
          path: data
          key: techbot-state-${{ github.run_id }}
          restore-keys: |
            techbot-state-

      - name: Prepare folders
        run: mkdir -p data logs assets

      - name: Run TechBot
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONPATH: src:.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EITAA_BOT_TOKEN: ${{ secrets.EITAA_API_KEY }}
          EITAA_API_KEY: ${{ secrets.EITAA_API_KEY }}
          EITAA_CHANNEL_ID: ${{ secrets.EITAA_CHANNEL_ID }}
        run: |
          PYTHONPATH=src python -u -m techbot.main --run-index ${{ github.event.inputs.run_index }} ${{ (github.event.inputs.dry_run == 'true') && '--dry-run' || '' }}

      - name: Save state cache
        if: success() && github.event.inputs.dry_run != 'true'
        uses: actions/cache/save@v4
        with:
          path: data
          key: techbot-state-${{ github.run_id }}