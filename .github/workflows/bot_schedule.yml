name: TechNews Bot Schedule

on:
  schedule:
    # Runs at 05:30, 08:30, 11:30, 14:30, 17:30 UTC (09:00, 12:00, 15:00, 18:00, 21:00 Tehran)
    - cron: '30 5,8,11,14,17 * * *'
  workflow_dispatch:
    inputs:
      run_index:
        description: 'Scheduled run index (1..5)'
        required: false
        default: '1'
      dry_run:
        description: 'Dry run without publishing'
        type: boolean
        default: false

jobs:
  run-techbot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore State Cache
        uses: actions/cache/restore@v4
        with:
          path: data
          key: techbot-state-${{ github.run_id }}
          restore-keys: |
            techbot-state-

      - name: Ensure Data Directory Exists
        run: mkdir -p data logs

      - name: Run TechBot Pipeline
        env:
          PYTHONPATH: src:.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EITAA_BOT_TOKEN: ${{ secrets.EITAA_API_KEY }}
          EITAA_API_KEY: ${{ secrets.EITAA_API_KEY }}
          EITAA_CHANNEL_ID: ${{ secrets.EITAA_CHANNEL_ID }}
        run: |
          PYTHONPATH=src python -m techbot.main --run-index ${{ github.event.inputs.run_index || 1 }} ${{ (github.event.inputs.dry_run == 'true') && '--dry-run' || '' }}

      - name: Save State Cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: data
          key: techbot-state-${{ github.run_id }}
