# =============================================================
# TechBot — Main Configuration
# =============================================================

bot:
  name: "تک‌نیوز"
  handle: "@tech_news_110"
  timezone: "Asia/Tehran"

sources:
  - name: "TechCrunch AI"
    url: "https://techcrunch.com/category/artificial-intelligence/feed/"
    category: "ai"
    weight: 1.2
    enabled: true

  - name: "The Verge AI"
    url: "https://www.theverge.com/rss/ai-artificial-intelligence/index.xml"
    category: "ai"
    weight: 1.1
    enabled: true

  - name: "Ars Technica"
    url: "https://feeds.arstechnica.com/arstechnica/index"
    category: "tech"
    weight: 1.0
    enabled: true

  - name: "Hacker News AI"
    url: "https://hnrss.org/newest?q=AI+artificial+intelligence&points=50"
    category: "ai"
    weight: 0.9
    enabled: true

  - name: "OpenAI Blog"
    url: "https://openai.com/blog/rss.xml"
    category: "ai"
    weight: 1.5
    enabled: true

  - name: "Google AI Blog"
    url: "https://blog.research.google/feeds/posts/default"
    category: "ai"
    weight: 1.4
    enabled: true

fetching:
  timeout_seconds: 10
  max_items_per_source: 20
  freshness_hours: 48
  user_agent: "TechBot/1.0 (+https://t.me/tech_news_110)"

scoring:
  ai_keywords:
    - "artificial intelligence"
    - "machine learning"
    - "deep learning"
    - "large language model"
    - "llm"
    - "gpt"
    - "gemini"
    - "claude"
    - "neural network"
    - "openai"
    - "google deepmind"
    - "generative ai"
    - "foundation model"
    - "transformer"
    - "diffusion model"
    - "reinforcement learning"
    - "fine-tuning"
    - "rag"
    - "multimodal"
  freshness_weight: 0.05
  min_score: 0.3

schedule:
  slots:
    - time: "09:00"
      posts: 2
      gap_minutes: 8
    - time: "12:00"
      posts: 2
      gap_minutes: 8
    - time: "15:00"
      posts: 2
      gap_minutes: 8
    - time: "18:00"
      posts: 2
      gap_minutes: 8
    - time: "21:00"
      posts: 2
      gap_minutes: 8
  lesson_slot: "09:00"
  lesson_day: "monday"

gemini:
  model: "gemini-3.8-flash"
  max_requests_per_day: 10
  batch_size: 3
  temperature: 0.4
  max_output_tokens: 32768
  response_mime_type: "application/json"

post:
  max_chars: 1024
  footer: "\n\n📡 @tech_news_110"
  hashtags:
    ai: "#هوش_مصنوعی #AI #تک_نیوز"
    tech: "#فناوری #Tech #تک_نیوز"
    lesson: "#آموزش #AI #هوش_مصنوعی #تک_نیوز"
    tool: "#ابزار #AI_Tools #تک_نیوز"
  buttons:
    source_label: "📰 منبع"
    read_more_label: "🔗 بیشتر بخوان"

destinations:
  telegram:
    enabled: true
    parse_mode: "HTML"
    max_retries: 3
    retry_delay_seconds: 5
    inter_post_delay_seconds: 3

  eitaa:
    enabled: true
    base_url: "https://eitaayar.ir/api"
    max_retries: 3
    retry_delay_seconds: 5
    inter_post_delay_seconds: 3

database:
  path: "data/techbot.sqlite"
  wal_mode: true
  busy_timeout_ms: 5000

logging:
  level: "INFO"
  file: "logs/techbot.log"
  max_bytes: 10485760
  backup_count: 5
  console: true

curriculum:
  path: "curriculum.json"
  loop: true
